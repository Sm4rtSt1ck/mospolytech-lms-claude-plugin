name: unitask release

# Push a tag "unitask-v<version>" to build unitask for every platform the plugin supports, publish the
# archives as a GitHub release of this repository and pin them in the plugin: the last step writes the
# version and SHA-256 of each archive into install.sh (.github/scripts/pin-unitask.sh), bumps the
# plugin's patch version and pushes that commit to main. install.sh refuses any archive whose checksum
# differs, so a release asset replaced later never reaches users.
# The push uses GITHUB_TOKEN and therefore does not start the CI workflow; the next push will.
on:
  push:
    tags: ["unitask-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unitask
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: unitask/go.mod
          cache-dependency-path: unitask/go.sum
      - run: go vet ./... && go test ./...
      - name: Build archives
        run: |
          version="${GITHUB_REF_NAME#unitask-v}"
          mkdir -p dist
          # target triple (as in install.sh) -> GOOS/GOARCH
          for pair in \
            x86_64-unknown-linux-gnu:linux/amd64 \
            aarch64-unknown-linux-gnu:linux/arm64 \
            x86_64-apple-darwin:darwin/amd64 \
            aarch64-apple-darwin:darwin/arm64 \
            x86_64-pc-windows-msvc:windows/amd64; do
            target="${pair%%:*}" platform="${pair#*:}"
            goos="${platform%/*}" goarch="${platform#*/}"
            name="unitask-$version-$target"
            stage="dist/$name"
            mkdir -p "$stage"
            exe=unitask; [[ "$goos" == windows ]] && exe=unitask.exe
            GOOS=$goos GOARCH=$goarch CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=$version" -o "$stage/$exe" .
            cp README.md "$stage/"
            if [[ "$goos" == windows ]]; then
              (cd dist && zip -qr "$name.zip" "$name")
            else
              tar -C dist -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum *.tar.gz *.zip | tee SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "unitask ${GITHUB_REF_NAME#unitask-v}" \
            --notes "TUI-канбан для progress.json. Ставится плагином mospolytech-lms автоматически." \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS
      # The tag may point to any commit; the pin goes on top of the current main.
      - name: Pin the release in install.sh and push to main
        working-directory: .
        run: |
          version="${GITHUB_REF_NAME#unitask-v}"
          cp unitask/dist/SHA256SUMS "$RUNNER_TEMP/SHA256SUMS"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main
            git checkout -q -B main origin/main
            bash .github/scripts/pin-unitask.sh "$version" "$RUNNER_TEMP/SHA256SUMS"
            git add plugins/mospolytech-lms/scripts/install.sh plugins/mospolytech-lms/.claude-plugin/plugin.json
            git commit -q -m "unitask $version: pin release checksums in install.sh"
            git push -q origin main && exit 0
            echo "main moved, retrying ($attempt)"
          done
          echo "::error::could not push the pin commit; run .github/scripts/pin-unitask.sh $version SHA256SUMS locally"
          exit 1
