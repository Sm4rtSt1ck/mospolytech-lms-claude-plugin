name: CI

on:
  push:
  pull_request:
  # Manual run also checks the connection to the real LMS (job "lms-connection").
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin
        run: claude plugin validate plugins/mospolytech-lms
      - name: Validate marketplace
        run: claude plugin validate .

  tests:
    name: Scripts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Hooks, install with checksums, Typst build
        shell: bash
        run: bash tests/run.sh
      - name: PowerShell scripts parse
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem -Recurse plugins -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $failed = $true; Write-Host "FAIL $($f.FullName)"; $errors | ForEach-Object { Write-Host "  $_" } }
            else { Write-Host "ok   $($f.FullName)" }
          }
          if ($failed) { exit 1 }

  mcp-start:
    name: MCP server starts in Claude Code (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      # --plugin-dir loads the plugin as "mospolytech-lms@inline", whose data directory is this one;
      # installing there reproduces what the SessionStart hook does for a real install.
      - name: Install moodle-mcp into the plugin data directory
        run: |
          CLAUDE_PLUGIN_ROOT="$PWD/plugins/mospolytech-lms" \
          CLAUDE_PLUGIN_DATA="$HOME/.claude/plugins/data/mospolytech-lms-inline" \
          bash plugins/mospolytech-lms/scripts/install.sh
      # Claude Code spawns the server from the plugin's .mcp.json exactly as for a user, including
      # the ${CLAUDE_PLUGIN_DATA} substitution and the command without .exe on Windows.
      - name: Claude Code connects to the plugin's MCP server
        run: |
          out="$(claude --plugin-dir plugins/mospolytech-lms mcp list 2>&1)"
          echo "$out"
          grep -q 'plugin:mospolytech-lms:moodle.*Connected' <<< "$out"

  lms-connection:
    name: LMS connection (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install moodle-mcp
        run: |
          CLAUDE_PLUGIN_ROOT="$PWD/plugins/mospolytech-lms" CLAUDE_PLUGIN_DATA="$RUNNER_TEMP/data" \
          bash plugins/mospolytech-lms/scripts/install.sh
      # moodle-mcp reports both a network failure and a TLS failure as "error sending request",
      # so first check plain reachability without certificate verification.
      - name: Is the LMS reachable from this runner
        id: reach
        run: |
          code="$(curl -sk --max-time 20 -o /dev/null -w '%{http_code}' https://online.mospolytech.ru/login/token.php || true)"
          echo "HTTP status without TLS verification: ${code:-none}"
          if [[ "$code" =~ ^[1-5][0-9][0-9]$ ]]; then echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::online.mospolytech.ru is not reachable from GitHub runners (likely blocks foreign networks) — TLS was not checked on $RUNNER_OS"
          fi
      # A login with a made-up account: "invalid username or password" proves that TLS (including the
      # missing GlobalSign intermediate) and the token endpoint work on this OS. No real credentials.
      - name: Reach token.php over TLS
        if: steps.reach.outputs.reachable == 'true'
        run: |
          [[ "$RUNNER_OS" == Linux ]] && export SSL_CERT_FILE="$RUNNER_TEMP/data/ca-bundle.pem"
          out="$("$RUNNER_TEMP/data/bin/moodle-mcp" auth --url https://online.mospolytech.ru \
                 --username ci-probe-nonexistent-user --password not-a-password --output json 2>&1 || true)"
          echo "$out"
          if grep -qi 'invalid username or password' <<< "$out"; then
            echo "LMS reachable, TLS ok"
          else
            echo "::error::the LMS answers plain HTTPS but moodle-mcp cannot talk to it — most likely the certificate chain"; exit 1
          fi
