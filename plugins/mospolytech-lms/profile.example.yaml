# Личный профиль студента. Плагин копирует этот файл в profile.yaml рабочей папки при первом запуске.
# Пустые поля заполнять не обязательно: Claude спросит их, когда понадобятся, и сохранит сюда.

student:
  full_name: ""      # Иванов Иван Иванович
  short_name: ""     # Иванов И. И. — для титульника
  group: ""          # 123-456
  faculty: ""        # Факультет информационных технологий
  department: ""     # Кафедра «Информатика и информационные технологии»
  program: ""        # 09.03.02 «Информационные системы и технологии»
  program_profile: "" # профиль подготовки
  study_form: ""     # очная / очно-заочная / заочная

paths:
  # Исходники отчётов, код и материалы: <documents_dir>/<курс>/lab-<N>/. Относительно рабочей папки или абсолютный.
  # Только отсюда плагин разрешает загружать файлы в LMS.
  documents_dir: documents

telegram:
  # Чаты, которые можно читать по просьбе. Claude спросит их при первом обращении к Telegram.
  chats: []          # общие чаты группы
  course_chats: {}   # course_id: [чаты конкретного курса]

# Данные по курсам, которые нельзя взять из LMS: вариант, номер в списке, преподаватель для титульника.
# Заполняется по ходу работы.
courses: {}
#  12345:
#    variant: 7
#    teachers: "Доцент кафедры ИКТ - Иванов И.И."   # none — не указывать на титульнике
