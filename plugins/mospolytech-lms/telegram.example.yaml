# Учебные чаты Telegram, которые плагин может читать (только чтение, через telegram-mcp).
# Скопируйте этот файл в рабочую папку как telegram.yaml и замените примеры своими чатами —
# или попросите Claude: он спросит, какие чаты читать, и заполнит файл сам.
# Файл личный: в репозиторий плагина он не попадает.

chats:
  - name: "Группа 123-456"            # точное название чата в Telegram
    id: -1001234567890                 # chat_id или @username; можно не указывать — найдётся по названию
    where: архив                       # где лежит: архив / форум / личный чат / обычная группа
    read: always                       # always — всегда; on-topic — только по предметам из subjects;
                                       # if-recent — только если за период были сообщения
    about: >
      Чат группы с преподавателями: сессия, пересдачи, порядок проведения, ссылки.
      Студенты пишут мало.

  - name: "Наша группа (форум)"
    where: архив, форум
    read: always
    topics:                            # для форумов: какие темы читать и какие пропускать
      read: [важное, общение]
      skip: [очередь]
    about: >
      Основное общение группы, преподавателей нет. В теме «очередь» занимают очередь
      на сдачу сообщениями «+» — такие сообщения пропускать.

  - name: "Проектирование ИС — подгруппа"
    id: -5550000000
    where: обычная группа
    read: on-topic
    subjects: [pis]                    # ключи предметов из progress.json
    course_ids: [12345]                # id курсов LMS — по ним скилл lms-lab выбирает чаты для работы
    lookback_days: 90                  # читать глубже обычного периода (например, есть долги)
    about: Чат подгруппы для совместных лабораторных по предмету.

  - name: "Иван Иванов"
    id: "@ivan_example"
    where: личный чат
    read: if-recent
    about: >
      Одногруппник: иногда спрашиваю у него про уже выполненные задания.
      Мои сообщения (out: true) — мой пересказ, а не первоисточник.

ignore:                                # похожие чаты, которые читать не нужно
  - name: "Старый чат группы"
    why: давно не используется
